name: Build and Push Docker

on:
  push:
    branches: [ "main" ]        # Only triggers Docker build on push to main
  pull_request:
    branches: [ "main" ]        # PRs only run Go build/test

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Go Project
        run: go build -v ./...

  docker:
    runs-on: ubuntu-latest
    needs: go-build
    if: github.event_name == 'push'         # Only run on direct push to main
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get last image version
        id: last_version
        run: |
          IMAGE_NAME=aasourav/watchcontainer
          LAST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^1\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          echo "Last tag: $LAST_TAG"

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="1.0"
          else
            MINOR=$(echo $LAST_TAG | cut -d. -f2)
            NEW_MINOR=$((MINOR+1))
            NEW_TAG="1.$NEW_MINOR"
          fi

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          IMAGE_NAME=aasourav/watchcontainer
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ steps.last_version.outputs.new_tag }} .

      - name: Push Docker Image
        run: |
          IMAGE_NAME=aasourav/watchcontainer
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ steps.last_version.outputs.new_tag }}
